<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel de leads | Dra. Luz Marina</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/painel.css"></head>
<body><main class="dashboard"><header><a class="brand" href="/"><span class="brand-mark">✳</span><strong>Dra. Luz Marina</strong></a><button id="logout" class="btn outline" hidden>Sair</button></header><p id="notice" role="status"></p>
<section id="auth" class="login-box" hidden><span class="eyebrow">Acesso restrito</span><h1 id="auth-title">Entrar no painel</h1><p id="auth-help">Acompanhe os contatos recebidos pelo site.</p><form id="auth-form"><label id="setup-label" hidden>Chave de configuração<input name="setupToken" type="password" autocomplete="off"></label><label>Usuário<input name="username" autocomplete="username" required minlength="3" maxlength="80" pattern="[a-zA-Z0-9_.@-]+"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><button class="btn" type="submit">Entrar</button></form></section>
<section id="contacts" hidden><div class="panel-title"><div><span class="eyebrow">Contatos do site</span><h1>Seus leads</h1></div><button id="refresh" class="btn outline">Atualizar</button></div><div id="counts" class="lead-counts"></div><div class="filters"><label>Buscar contato<input id="search" type="search" placeholder="Nome, telefone ou tratamento"></label><label>Status<select id="filter"><option>Todos</option><option>Novo</option><option>Em contato</option><option>Agendado</option><option>Concluído</option></select></label></div><p id="result-count"></p><div id="lead-list"></div></section></main><script src="/painel.js"></script></body></html>
